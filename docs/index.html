<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banner maker · CARTIQO Labs</title>
<meta name="description" content="Make CARTIQO banners in the sizes GitHub, Discord, X, LinkedIn and YouTube want.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1013'/%3E%3Cpath d='M19.5 6 H11 A4 4 0 0 0 7 10 V22 A4 4 0 0 0 11 26 H19.5' fill='none' stroke='%23F4F4F6' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='24' r='2.2' fill='%237C5CFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1013;
    --surface: #15171B;
    --surface-2: #1B1E23;
    --line: rgba(244, 244, 246, 0.1);
    --line-strong: rgba(244, 244, 246, 0.2);
    --ink: #F4F4F6;
    --muted: rgba(244, 244, 246, 0.64);
    --faint: rgba(244, 244, 246, 0.42);
    --accent: #7C5CFF;
    --on-accent: #FFFFFF;
    --focus: #9F8AFF;
    --radius: 8px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #FFFAFA;
      --surface: #FFFFFF;
      --surface-2: #F5F2F2;
      --line: rgba(17, 17, 19, 0.1);
      --line-strong: rgba(17, 17, 19, 0.22);
      --ink: #111113;
      --muted: rgba(17, 17, 19, 0.66);
      --faint: rgba(17, 17, 19, 0.45);
      --focus: #6A47FF;
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 14px/1.5 Geist, Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 24px;
    height: 56px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .brand .mark { display: block; height: 15px; }
  .brand .mark svg { display: block; height: 100%; width: auto; }
  .brand .name { color: var(--muted); font-weight: 500; padding-left: 12px; border-left: 1px solid var(--line-strong); line-height: 18px; }
  .top nav { display: flex; gap: 20px; }
  .top nav a { color: var(--muted); text-decoration: none; font-weight: 500; font-size: 13px; }
  .top nav a:hover { color: var(--ink); }

  .app {
    flex: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 360px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }

  .stage { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .frame {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 320px;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 16px 16px;
  }
  .canvas { position: relative; display: inline-block; line-height: 0; max-width: 100%; }
  .canvas img {
    display: block;
    max-width: 100%;
    max-height: calc(100vh - 220px);
    width: auto;
    height: auto;
    border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
  }
  .safe { position: absolute; border: 1px dashed #FF7A80; pointer-events: none; }
  .safe::after {
    content: 'Safe area';
    position: absolute;
    top: 4px;
    left: 6px;
    font: 500 11px/1 Geist, system-ui, sans-serif;
    color: #FF7A80;
  }
  .meta { margin: 0; display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; }
  .meta b { font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 500; color: var(--ink); font-size: 12px; }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  fieldset { border: 0; margin: 0; padding: 20px; display: grid; gap: 14px; }
  fieldset + fieldset { border-top: 1px solid var(--line); }
  legend {
    float: left;
    width: 100%;
    padding: 0;
    margin-bottom: 2px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }
  label, .field { display: grid; gap: 6px; font-size: 13px; font-weight: 500; }
  .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
  .hint.warn { color: #FF7A80; }
  @media (prefers-color-scheme: light) { .hint.warn { color: #D4232F; } }

  input[type=text], input[type=number], select {
    width: 100%;
    height: 36px;
    padding: 0 10px;
    border-radius: var(--radius);
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    font-weight: 400;
  }
  input[type=text].caps { text-transform: uppercase; letter-spacing: 0.04em; }
  input[type=number] { font-variant-numeric: tabular-nums; }
  select { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 17px) 15px, calc(100% - 12px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }
  input:hover, select:hover { border-color: var(--faint); }

  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; gap: 3px; border-radius: var(--radius); background: var(--surface-2); border: 1px solid var(--line); }
  .segmented label { display: block; position: relative; }
  .segmented input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .segmented span { display: block; text-align: center; padding: 6px 0; border-radius: 6px; color: var(--muted); transition: background 100ms, color 100ms; }
  .segmented input:checked + span { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
  .segmented input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px; }

  .swatches { display: flex; flex-wrap: wrap; gap: 7px; }
  .swatch { position: relative; width: 24px; height: 24px; }
  .swatch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .swatch span {
    display: block;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: inset 0 0 0 1px var(--line-strong);
  }
  .swatch input:checked + span { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }
  .swatch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 4px; }
  .swatch.custom span {
    background: conic-gradient(#FF7A80, #F5B544, #4FD383, #38C9E0, #7D97FF, #B69BFF, #FF7A80);
  }
  .swatch.custom.on span { background: var(--c); }

  .range { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
  .range output { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); min-width: 40px; text-align: right; }
  input[type=range] { width: 100%; accent-color: var(--accent); }

  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .checks label { display: flex; align-items: center; gap: 8px; font-weight: 400; cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }

  .actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .actions select { width: 72px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button {
    height: 36px;
    padding: 0 12px;
    border-radius: var(--radius);
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: 500 13px/1 Geist, Inter, system-ui, sans-serif;
    cursor: pointer;
    transition: background 100ms, border-color 100ms;
  }
  button:hover { background: var(--surface-2); border-color: var(--faint); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: #6A47FF; border-color: #6A47FF; }
  .status { margin: 0; min-height: 20px; font-size: 13px; color: var(--muted); }

  footer {
    padding: 20px 24px 28px;
    color: var(--faint);
    font-size: 13px;
    text-align: center;
  }
  footer a { color: var(--muted); }

  @media (max-width: 960px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 16px; gap: 16px; }
    .stage { position: static; order: -1; }
    .frame { padding: 16px; min-height: 0; }
    .canvas img { max-height: 60vh; }
    .top { padding: 0 16px; }
    .top nav a:not(:last-child) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="https://github.com/cartiqolabs" aria-label="CARTIQO Labs on GitHub">
    <span class="mark" id="mark"></span>
    <span class="name">Banner maker</span>
  </a>
  <nav>
    <a href="https://github.com/cartiqolabs/.github/tree/main/docs">Source</a>
    <a href="https://discord.gg/A6b4bTTaeJ">Discord</a>
  </nav>
</header>

<main class="app">
  <form class="panel" id="form" autocomplete="off" onsubmit="return false">
    <fieldset>
      <legend>Size</legend>
      <label>Format
        <select id="size"></select>
      </label>
      <div class="two">
        <label>Width <input type="number" id="width" min="100" max="6000" step="1" inputmode="numeric"></label>
        <label>Height <input type="number" id="height" min="100" max="6000" step="1" inputmode="numeric"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Text</legend>
      <label>Wordmark
        <input type="text" class="caps" id="wordmark" spellcheck="false" maxlength="40">
        <span class="hint" id="wordmark-hint">Letters, numbers, spaces and . - / ! '. A full stop becomes the dot.</span>
      </label>
      <label>Line above <input type="text" class="caps" id="overline" spellcheck="false" maxlength="60"></label>
      <label>Motto <input type="text" class="caps" id="motto" spellcheck="false" maxlength="60"></label>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <div class="field">Theme
        <div class="segmented" role="radiogroup" aria-label="Theme">
          <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
          <label><input type="radio" name="theme" value="light"><span>Light</span></label>
        </div>
      </div>
      <div class="field">Dot colour
        <div class="swatches" id="swatches" role="radiogroup" aria-label="Dot colour"></div>
      </div>
      <label>Content size
        <span class="range"><input type="range" id="scale" min="50" max="150" step="5"><output id="scale-out" for="scale"></output></span>
      </label>
      <div class="checks">
        <label><input type="checkbox" id="grid"> Grid</label>
        <label><input type="checkbox" id="corners"> Corner marks</label>
        <label><input type="checkbox" id="rule"> Divider</label>
        <label><input type="checkbox" id="border"> Border</label>
        <label id="safe-toggle" hidden><input type="checkbox" id="safeGuide"> Show safe area</label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div class="actions">
        <button type="button" class="primary" id="download-png">Download PNG</button>
        <select id="pngScale" aria-label="PNG scale">
          <option value="1">1×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <div class="row">
        <button type="button" id="download-svg">SVG</button>
        <button type="button" id="copy-svg">Copy SVG</button>
        <button type="button" id="copy-link">Copy link</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </fieldset>
  </form>

  <section class="stage" aria-label="Preview">
    <div class="frame">
      <div class="canvas">
        <img id="preview" alt="">
        <div class="safe" id="safe" hidden></div>
      </div>
    </div>
    <p class="meta"><span id="format"></span><b id="dims"></b></p>
  </section>
</main>

<footer>
  Made by <a href="https://github.com/cartiqolabs">CARTIQO Labs</a>. The wordmark is drawn from the same strokes as the CARTIQO logo.
</footer>

<script src="banner.js"></script>
<script>
(function () {
  'use strict';
  const B = window.CartiqoBanner;
  const $ = function (id) { return document.getElementById(id); };
  const form = $('form');

  const DEFAULTS = {
    size: 'github',
    width: 1280,
    height: 360,
    wordmark: B.DEFAULTS.wordmark,
    overline: B.DEFAULTS.overline,
    motto: B.DEFAULTS.motto,
    theme: 'dark',
    accent: 'cartiqo',
    scale: 100,
    grid: true,
    corners: true,
    rule: true,
    border: true,
    safeGuide: true,
    pngScale: 2,
  };
  const state = Object.assign({}, DEFAULTS, readHash());

  // The link carries every setting that differs from the defaults.
  function readHash() {
    const out = {};
    const params = new URLSearchParams(location.hash.slice(1));
    Object.keys(DEFAULTS).forEach(function (key) {
      if (!params.has(key)) return;
      const v = params.get(key);
      const d = DEFAULTS[key];
      if (typeof d === 'boolean') out[key] = v === '1';
      else if (typeof d === 'number') { if (isFinite(Number(v)) && v !== '') out[key] = Number(v); }
      else out[key] = v;
    });
    return out;
  }

  function writeHash() {
    const params = new URLSearchParams();
    Object.keys(DEFAULTS).forEach(function (key) {
      if (state[key] === DEFAULTS[key]) return;
      params.set(key, typeof state[key] === 'boolean' ? (state[key] ? '1' : '0') : state[key]);
    });
    const hash = params.toString();
    history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
  }

  // Measures the small caps lines with the fonts the banner falls back to,
  // so the divider fits the motto the way GitHub will show it.
  const ctx = document.createElement('canvas').getContext('2d');
  function measure(text, size, spacing) {
    ctx.font = '500 ' + size + "px 'Helvetica Neue', Helvetica, Arial, sans-serif";
    return ctx.measureText(text).width + spacing * text.length;
  }

  function preset() {
    return B.SIZES.find(function (s) { return s.id === state.size; }) || null;
  }

  function currentSvg() {
    const p = preset();
    return B.render({
      width: state.width,
      height: state.height,
      safe: p && p.safe ? p.safe : null,
      wordmark: state.wordmark,
      overline: state.overline,
      motto: state.motto,
      theme: state.theme,
      accent: state.accent,
      scale: state.scale / 100,
      grid: state.grid,
      corners: state.corners,
      rule: state.rule,
      border: state.border,
      measure: measure,
    });
  }

  function dataUrl(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function fileName(ext, scale) {
    const slug = state.wordmark.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'banner';
    return slug + '-' + state.width + 'x' + state.height + '-' + state.theme + (scale > 1 ? '@' + scale + 'x' : '') + '.' + ext;
  }

  function save(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  let statusTimer = 0;
  function say(text) {
    $('status').textContent = text;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { $('status').textContent = ''; }, 4000);
  }

  function copy(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { say(done); }, function () { say('Your browser blocked the clipboard. Use the SVG button instead.'); });
    } else {
      say('Your browser blocked the clipboard. Use the SVG button instead.');
    }
  }

  // Controls

  const sizeSelect = $('size');
  B.SIZES.forEach(function (s) {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = s.name + ' · ' + s.width + ' × ' + s.height;
    sizeSelect.appendChild(o);
  });
  const customOption = document.createElement('option');
  customOption.value = 'custom';
  customOption.textContent = 'Custom size';
  sizeSelect.appendChild(customOption);

  const swatches = $('swatches');
  Object.keys(B.ACCENTS).forEach(function (key) {
    const label = document.createElement('label');
    label.className = 'swatch';
    label.title = B.ACCENTS[key].name;
    label.innerHTML = '<input type="radio" name="accent" value="' + key + '" aria-label="' + B.ACCENTS[key].name + '"><span></span>';
    swatches.appendChild(label);
  });
  const custom = document.createElement('label');
  custom.className = 'swatch custom';
  custom.title = 'Pick a colour';
  custom.innerHTML = '<input type="color" id="accent-custom" aria-label="Pick a colour"><span></span>';
  swatches.appendChild(custom);

  function syncControls() {
    sizeSelect.value = preset() ? state.size : 'custom';
    $('width').value = state.width;
    $('height').value = state.height;
    $('wordmark').value = state.wordmark;
    $('overline').value = state.overline;
    $('motto').value = state.motto;
    form.querySelectorAll('input[name=theme]').forEach(function (r) { r.checked = r.value === state.theme; });
    $('scale').value = state.scale;
    ['grid', 'corners', 'rule', 'border', 'safeGuide'].forEach(function (k) { $(k).checked = state[k]; });
    $('pngScale').value = String(state.pngScale);
  }

  function update() {
    const svg = currentSvg();
    $('preview').src = dataUrl(svg);
    $('preview').alt = 'Banner preview, ' + state.width + ' by ' + state.height;

    const p = preset();
    $('format').textContent = p ? p.name : 'Custom size';
    $('dims').textContent = state.width + ' × ' + state.height;
    $('scale-out').textContent = state.scale + '%';

    // Swatches show the colour the dot gets on the current theme.
    swatches.querySelectorAll('input[name=accent]').forEach(function (r) {
      const a = B.ACCENTS[r.value];
      r.nextElementSibling.style.setProperty('--c', a[state.theme]);
      r.checked = r.value === state.accent;
    });
    const isCustom = !B.ACCENTS[state.accent];
    custom.classList.toggle('on', isCustom);
    if (isCustom) {
      custom.querySelector('span').style.setProperty('--c', state.accent);
      $('accent-custom').value = state.accent;
    }

    const hasSafe = !!(p && p.safe);
    $('safe-toggle').hidden = !hasSafe;
    const safe = $('safe');
    safe.hidden = !(hasSafe && state.safeGuide);
    if (hasSafe) {
      safe.style.left = ((state.width - p.safe.width) / 2 / state.width * 100) + '%';
      safe.style.top = ((state.height - p.safe.height) / 2 / state.height * 100) + '%';
      safe.style.width = (p.safe.width / state.width * 100) + '%';
      safe.style.height = (p.safe.height / state.height * 100) + '%';
    }

    const left = Array.from(new Set(Array.from(state.wordmark.toUpperCase()).filter(function (c) { return B.CHARACTERS.indexOf(c) < 0; })));
    const hint = $('wordmark-hint');
    hint.classList.toggle('warn', left.length > 0);
    hint.textContent = left.length
      ? 'The wordmark has no ' + left.join(' ') + ', so ' + (left.length > 1 ? 'they are' : 'it is') + ' left out.'
      : "Letters, numbers, spaces and . - / ! '. A full stop becomes the dot.";

    writeHash();
  }

  function clampSize(v, fallback) {
    v = Math.round(Number(v));
    return isFinite(v) && v >= 100 && v <= 6000 ? v : fallback;
  }

  sizeSelect.addEventListener('change', function () {
    state.size = sizeSelect.value;
    const p = preset();
    if (p) { state.width = p.width; state.height = p.height; }
    syncControls();
    update();
  });

  ['width', 'height'].forEach(function (k) {
    $(k).addEventListener('input', function () {
      const v = clampSize($(k).value, null);
      if (v === null) return;
      state[k] = v;
      const match = B.SIZES.find(function (s) { return s.width === state.width && s.height === state.height; });
      state.size = match ? match.id : 'custom';
      sizeSelect.value = match ? match.id : 'custom';
      update();
    });
    $(k).addEventListener('change', function () { $(k).value = state[k]; });
  });

  ['wordmark', 'overline', 'motto'].forEach(function (k) {
    $(k).addEventListener('input', function () { state[k] = $(k).value; update(); });
  });

  form.addEventListener('change', function (e) {
    const t = e.target;
    if (t.name === 'theme') state.theme = t.value;
    else if (t.name === 'accent') state.accent = t.value;
    else if (t.type === 'checkbox') state[t.id] = t.checked;
    else if (t.id === 'pngScale') state.pngScale = Number(t.value);
    else return;
    update();
  });

  $('accent-custom').addEventListener('input', function (e) {
    state.accent = e.target.value.toUpperCase();
    update();
  });

  $('scale').addEventListener('input', function () {
    state.scale = Number($('scale').value);
    update();
  });

  // Export

  $('download-svg').addEventListener('click', function () {
    const name = fileName('svg', 1);
    save(new Blob([currentSvg()], { type: 'image/svg+xml' }), name);
    say('Saved ' + name + '.');
  });

  $('download-png').addEventListener('click', function () {
    const scale = state.pngScale;
    const img = new Image();
    img.onload = function () {
      const canvas = document.createElement('canvas');
      canvas.width = state.width * scale;
      canvas.height = state.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob(function (blob) {
        if (!blob) { say('That PNG is too big for this browser. Try 1× or a smaller size.'); return; }
        const name = fileName('png', scale);
        save(blob, name);
        say('Saved ' + name + '.');
      }, 'image/png');
    };
    img.onerror = function () { say('The PNG could not be drawn. Download the SVG instead.'); };
    img.src = dataUrl(currentSvg());
  });

  $('copy-svg').addEventListener('click', function () { copy(currentSvg(), 'Copied the SVG.'); });
  $('copy-link').addEventListener('click', function () { copy(location.href, 'Copied a link to this banner.'); });

  $('mark').innerHTML = B.wordmark('CARTIQO.', 'currentColor', B.ACCENTS.cartiqo.dark);

  window.addEventListener('hashchange', function () {
    Object.assign(state, DEFAULTS, readHash());
    syncControls();
    update();
  });

  syncControls();
  update();
})();
</script>
</body>
</html>
